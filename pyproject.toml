[project]
name = "hermes-core"
version = "0.0.1"
description = "Scaffolding condiviso della toolbox multi-agente difensiva Hermes: orchestratore, server MCP (registry tool + risk tier + vault), logging JSONL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gabriele1701" }]

# Intervalli con tetto, e minimi veritieri.
#
# "mcp>=1.2.0" dichiarava compatibili versioni che il codice NON puo'
# importare: mcp.server.mcpserver.MCPServer esiste solo dalla 2.x. Un vincolo
# che descrive il falso fa passare per compatibili versioni che non
# partirebbero, e fa comparire nelle scansioni advisory su versioni che non
# useremmo mai.
#
# Il tetto non protegge da un rilascio compromesso dentro l'intervallo: quella
# e' la funzione del lockfile con hash (vedi docs/dipendenze.md). Serve a non
# accogliere una major nuova senza averla provata.
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: avvia processi veri e parla MCP su stdio (~1.5s l'uno). Saltabili durante l'iterazione con: pytest -m 'not slow'",
]
