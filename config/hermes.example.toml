#
# Configurazione d'esempio di un'istanza del server MCP di hermes-core.
#
# Un'istanza appartiene a UN agente: l'identità è fissata qui e non è un
# parametro che il client può fornire. Per più agenti si lanciano più
# processi, ciascuno con la propria configurazione.
#
# Copiare in config/hermes.toml (ignorato da git) e adattare.
#

[server]
# Agente proprietario di questa istanza.
# Ammessi: orchestrator, echo_dummy, vuln_assessment, pentest_kali
agent = "echo_dummy"

# Radice entro cui gli script dei tool devono restare. I percorsi relativi
# sono risolti rispetto alla directory di questo file.
repo_root = ".."

# Log d'audit JSONL.
#
# ATTENZIONE AL PERCORSO. Un valore RELATIVO è risolto rispetto alla directory
# di QUESTO file, quindi "var/log/hermes/audit.jsonl" finisce dentro il repo,
# mentre "/var/log/hermes/audit.jsonl" è assoluto. Uno slash di differenza.
#
# Il valore qui sotto tiene il log dentro il repo, e va bene SOLO per lo
# sviluppo in locale. In un dispiegamento reale il repo è in sola lettura per
# l'utente che esegue il server — è la mitigazione del TOCTOU fra verifica
# dello SHA ed esecuzione — e quindi il log NON può starci dentro: il server
# non riuscirebbe a crearlo e non partirebbe.
#
# Per il dispiegamento su VM dedicata (vedi docs/setup-vm-hermes.md) usare un
# percorso assoluto fuori dal repo, su una directory del servizio:
#
#     log_path = "/var/log/hermes/audit.jsonl"
#
# Da proteggere poi con `sudo chattr +a`, dopo il primo avvio.
log_path = "../logs/hermes-audit.jsonl"

# Disponibilità del runtime isolato. A false, i tool che dichiarano
# requires_container vengono NEGATI, non eseguiti sull'host.
container_available = false

[vault]
# In questa milestone è disponibile solo "stub", che non contiene
# credenziali reali. Un backend sconosciuto fa fallire l'avvio.
backend = "stub"

# Solo NOMI di segreti da seminare nello stub: nessun valore va in config.
# Nel vault reale entrano unicamente le credenziali delle proprie VM di
# laboratorio.
stub_secrets = ["ssh/lab-kali"]

# --------------------------------------------------------------------------- #
# Tool registrati.
#
# default_tier è obbligatorio: la sua assenza fa fallire la registrazione,
# non ricade su un default permissivo. Il tier non è modificabile dopo la
# registrazione; un override può solo innalzarlo.
#
# exec_sha256 deve corrispondere allo SHA-256 effettivo dello script: viene
# verificato prima di OGNI esecuzione. Per calcolarlo:
#     sha256sum agents/echo_agent/run.py
# --------------------------------------------------------------------------- #

[[tool]]
tool_id = "echo.ping"
owner_agent = "echo_dummy"
default_tier = "verde"
personal_data = false
requires_container = false
exec_path = "agents/echo_agent/run.py"
exec_sha256 = "34b7aa6afc7f96e5c88ecfd8f4305a0739743bc5a1f7aa27ee2b63546518d3a8"
description = "Agente dummy: restituisce un risultato conforme al contratto."
