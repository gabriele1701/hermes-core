#
# Configurazione d'esempio di un'istanza del server MCP di hermes-core.
#
# Un'istanza appartiene a UN agente: l'identità è fissata qui e non è un
# parametro che il client può fornire. Per più agenti si lanciano più
# processi, ciascuno con la propria configurazione.
#
# Copiare in config/hermes.toml (ignorato da git) e adattare.
#

[server]
# Agente proprietario di questa istanza.
# Ammessi: orchestrator, echo_dummy, vuln_assessment, pentest_kali
agent = "echo_dummy"

# Radice entro cui gli script dei tool devono restare. I percorsi relativi
# sono risolti rispetto alla directory di questo file.
repo_root = ".."

# Log d'audit JSONL.
#
# ATTENZIONE AL PERCORSO. Un valore RELATIVO è risolto rispetto alla directory
# di QUESTO file, quindi "var/log/hermes/audit.jsonl" finisce dentro il repo,
# mentre "/var/log/hermes/audit.jsonl" è assoluto. Uno slash di differenza.
#
# Il valore qui sotto tiene il log dentro il repo, e va bene SOLO per lo
# sviluppo in locale. In un dispiegamento reale il repo è in sola lettura per
# l'utente che esegue il server — è la mitigazione del TOCTOU fra verifica
# dello SHA ed esecuzione — e quindi il log NON può starci dentro: il server
# non riuscirebbe a crearlo e non partirebbe.
#
# Per il dispiegamento su VM dedicata (vedi docs/setup-vm-hermes.md) usare un
# percorso assoluto fuori dal repo, su una directory del servizio:
#
#     log_path = "/var/log/hermes/audit.jsonl"
#
# Da proteggere poi con `sudo chattr +a`, dopo il primo avvio.
log_path = "../logs/hermes-audit.jsonl"

# Directory dello stato condiviso fra i processi del server:
#   - overrides.jsonl   store append-only degli innalzamenti di tier
#   - slots/<agente>/   posti di esecuzione, per il limite di concorrenza
#
# Hermes avvia un processo server NUOVO a ogni connessione, a ogni
# /reload-mcp e a ogni sessione. Senza questa directory un tool innalzato a
# "rosso" torna al proprio tier dichiarato poco dopo, e nessuno lo segnala:
# chi alza un tier dopo un incidente si aspetta il contrario.
#
# Se la riga è assente, il server parte comunque e gli innalzamenti valgono
# per la connessione — ma lo DICHIARA, nel campo override_scope delle
# risposte e nel log. Il preflight lo segnala come avviso.
#
# DA SAPERE PRIMA DI USARLA: con la persistenza attiva, un tier alzato RESTA
# alzato. Un tool portato a "rosso" richiede conferma, e finché il canale di
# conferma non è collegato quel tool non è più invocabile e non torna da solo.
# Si scende solo rimuovendo le righe dallo store, a mano e da privilegiato:
# la procedura è in docs/setup-vm-hermes.md. È voluto — un declassamento è un
# atto di chi amministra, non una chiamata che il modello possa fare.
#
# ATTENZIONE AL PERCORSO, come per log_path: un valore relativo è risolto
# rispetto alla directory di QUESTO file e finirebbe dentro il repo, dove un
# checkout o una pulizia lo cancellerebbero. Uno stato di sicurezza non va
# nell'albero di lavoro. Da creare prima:
#
#     sudo install -d -o hermes -g hermes -m 700 /var/lib/hermes/state
#
# Sottodirectory e non /var/lib/hermes: lì vive anche la .ssh del
# servizio, e stato e credenziali non condividono una cartella.
#
# state_dir = "/var/lib/hermes/state"

# Disponibilità del runtime isolato. A false, i tool che dichiarano
# requires_container vengono NEGATI, non eseguiti sull'host.
container_available = false

# Interprete con cui vengono eseguiti i tool. PERCORSO ASSOLUTO obbligatorio:
# un nome come "python3" lo farebbe risolvere dal PATH del server, e quale
# codice gira diventerebbe una proprietà dell'ambiente di avvio invece di una
# decisione. Verificato all'avvio: deve esistere ed essere eseguibile.
#
# Non deve stare dentro repo_root né essere scrivibile da gruppo o altri: lo
# SHA pinna gli script, non chi li esegue. Il preflight lo controlla.
tool_python = "/usr/bin/python3"

# Flag di isolamento dell'interprete. Il default è il più stretto:
#   -I  modalità isolata: esclude da sys.path la directory dello script e lo
#       user site dell'utente di servizio, e ignora le variabili PYTHON*.
#       Chiude due vie per cui codice non verificato girerebbe prima dello
#       script lasciando lo SHA intatto.
#   -S  salta site: nessun site-packages, nessun file .pth.
#
# Un tool che avesse bisogno di pacchetti di terze parti non partirebbe. La
# risposta giusta in quel caso è un venv dedicato in sola lettura per quel
# tool, non allentare i flag per tutti.
tool_python_flags = ["-I", "-S"]

# Tetto sull'output di un tool, per ciascuno dei due stream. L'output finisce
# nel contesto del modello: senza limite, un tool prolisso — o un bersaglio
# che risponde a valanga — riempie la memoria del server e il contesto
# dell'agente. Oltre il tetto l'output viene tagliato e il risultato lo
# DICHIARA (campo "truncated"), perché un taglio silenzioso fa trarre
# conclusioni sbagliate.
max_output_bytes = 1048576

# Esecuzioni di tool contemporanee ammesse in questo processo. Un modello in
# ciclo può invocare senza fermarsi: oltre il limite l'invocazione viene
# rifiutata e la riga finisce nel log, invece di accumularsi.
#
# Con state_dir configurata il limite è comune alle connessioni dello STESSO
# agente, tramite un file di lock per posto in state_dir/slots/<agente>/.
# Senza state_dir resta per processo, e Hermes avvia un processo per
# connessione: contiene un ciclo dentro una sessione, non la somma di più
# sessioni. Il preflight dice quale dei due vale, e il catalogo lo dichiara
# in concurrency_shared_across_connections.
#
# Attenzione: configurare state_dir è una promessa. Se poi la directory dei
# posti non è utilizzabile (permessi, disco pieno), il gate RIFIUTA ogni
# invocazione invece di ricadere sul limite per processo: un tetto dichiarato
# e non applicato è peggio di un tetto che non c'è, perché nessuno lo sa.
#
# I posti sono per agente di proposito: un pool unico permetterebbe a un
# agente in ciclo di affamare gli altri. Il tetto di macchina è quindi
# max_concurrent_tools × agenti attivi; per un tetto di macchina vero servono
# una slice systemd o un cgroup, che contano risorse e non esecuzioni.
max_concurrent_tools = 2

[vault]
# In questa milestone è disponibile solo "stub", che non contiene
# credenziali reali. Un backend sconosciuto fa fallire l'avvio.
backend = "stub"

# Solo NOMI di segreti da seminare nello stub: nessun valore va in config.
# Nel vault reale entrano unicamente le credenziali delle proprie VM di
# laboratorio.
stub_secrets = ["ssh/lab-kali"]

# --------------------------------------------------------------------------- #
# Tool registrati.
#
# default_tier è obbligatorio: la sua assenza fa fallire la registrazione,
# non ricade su un default permissivo. Il tier non è modificabile dopo la
# registrazione; un override può solo innalzarlo.
#
# override_tier (opzionale) innalza il tier in modo VERSIONATO: resta scritto
# qui, si vede in review e sopravvive a tutto. È la via da preferire per un
# innalzamento che deve durare, mentre raise_tool_tier via MCP serve a reagire
# subito. Può solo innalzare: un valore pari o inferiore a default_tier è
# inerte e viene registrato nel log come refuso; un valore inventato fa
# FALLIRE l'avvio, perché chi l'ha scritto crede di aver alzato un tier.
#
# exec_sha256 deve corrispondere allo SHA-256 effettivo dello script: viene
# verificato prima di OGNI esecuzione. Per calcolarlo:
#     sha256sum agents/echo_agent/run.py
# --------------------------------------------------------------------------- #

[[tool]]
tool_id = "echo.ping"
owner_agent = "echo_dummy"
default_tier = "verde"
personal_data = false
requires_container = false
exec_path = "agents/echo_agent/run.py"
exec_sha256 = "34b7aa6afc7f96e5c88ecfd8f4305a0739743bc5a1f7aa27ee2b63546518d3a8"
description = "Agente dummy: restituisce un risultato conforme al contratto."
