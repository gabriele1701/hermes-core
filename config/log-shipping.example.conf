# Spedizione del log d'audit a una seconda macchina — modello.
#
# Si installa come file di ROOT, non scrivibile da chi lo usa:
#
#     sudo install -m 644 -o root -g root \
#          config/log-shipping.example.conf /etc/hermes/log-shipping.conf
#     sudo editor /etc/hermes/log-shipping.conf
#
# Di root per la stessa ragione del perimetro dei bersagli: se `hermes-ship`
# potesse riscrivere la propria destinazione, un mittente compromesso
# spedirebbe le prove a sé stesso e da qui sembrerebbe tutto a posto. Una
# restrizione custodita da chi la subisce non è una restrizione.
#
# Il formato è `CHIAVE=valore`, letto riga per riga e MAI eseguito: una
# chiave non riconosciuta ferma lo script invece di essere ignorata, perché
# un refuso silenzioso in una configurazione di sicurezza è un'impostazione
# che credi di aver messo.
#
# ATTENZIONE AI VALORI DI ESEMPIO. Gli indirizzi qui sotto sono quelli del
# laboratorio da cui nasce il progetto: su un'altra installazione sono
# PLAUSIBILI E SBAGLIATI, e un valore plausibile passa i controlli dando una
# destinazione che non è la tua. Vanno riscritti tutti, non riletti.

# La macchina che conserva la copia. Non deve essere la stessa che genera il
# log, e non deve essere raggiungibile da ciò che gira dentro i tool.
COLLECTOR_HOST=192.168.205.50

# La porta su cui il collector ascolta. Facoltativa: senza, vale la 22.
# Si dichiara perche' la 22 e' la porta solita, non l'unica — e un mittente
# che la desse per scontata non raggiungerebbe un collector configurato
# altrimenti. Deve coincidere con la porta aperta in `ufw` e con quella usata
# per costruire `known_hosts`, che per una porta diversa dalla 22 scrive le
# voci nella forma `[indirizzo]:porta`.
COLLECTOR_PORTA=22

# L'utente sul collector. Il suo accesso è vincolato da un `ForceCommand`:
# non ha una shell là sopra, ha solo `hermes-log-receive`.
COLLECTOR_UTENTE=hermes-collect

# Chiave privata del mittente. Vive in una directory di `hermes-ship`, che
# l'utente di servizio `hermes` non può leggere: un servizio compromesso non
# deve poter prendere la credenziale che spedisce le prove della propria
# compromissione.
CHIAVE=/var/lib/hermes-ship/id_ed25519

# Chiave PUBBLICA del collector, nella forma di `known_hosts`.
#
# Non è un dettaglio di comodità: con la verifica dell'host disattivata, chi
# riesce a prendere il posto del collector riceve il log e lo fa sparire,
# mentre da questa parte ogni spedizione risulta riuscita. Il file lo scrive
# chi installa, una volta, leggendo l'impronta SULLA CONSOLE del collector e
# non da ciò che risponde in rete.
KNOWN_HOSTS=/var/lib/hermes-ship/known_hosts

# Dove il mittente annota com'è andato l'ultimo giro. Non è la fonte della
# verità — quella è il collector — ma è ciò che il preflight legge per dire
# se la spedizione è viva e quanto è indietro.
STATO_DIR=/var/lib/hermes-ship/stato

# I canali: `CANALE_<nome>=<percorso assoluto>`.
#
# Il nome è una chiave, non un pezzo di percorso: sul collector decide dove
# scrivere il ricevente, che accetta solo i nomi che conosce. Il percorso di
# `CANALE_audit` deve coincidere con `server.log_path` della configurazione
# del server — due fonti per lo stesso file sono due fonti che divergono, e
# il preflight le confronta.
CANALE_audit=/var/log/hermes/audit.jsonl
CANALE_overrides=/var/lib/hermes/state/overrides.jsonl
