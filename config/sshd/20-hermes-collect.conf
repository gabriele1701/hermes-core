# hermes-core — canale di ricezione del log (A5)
#
# QUESTO FILE VA SUL COLLECTOR, non sulla macchina sorvegliata. È l'unico
# artefatto di questo repo che si installa su un'altra macchina.
#
#   sudo install -m 644 -o root -g root \
#       config/sshd/20-hermes-collect.conf /etc/ssh/sshd_config.d/20-hermes-collect.conf
#   sudo install -m 755 -o root -g root \
#       bin/hermes-log-receive /usr/local/sbin/hermes-log-receive
#   sudo sshd -t && sudo systemctl reload ssh
#
# Valgono le stesse avvertenze di `10-hermes.conf`: l'`Include` deve esserci
# e stare in cima, e ciò che conta è cosa risponde `sshd -T`, non cosa c'è
# scritto qui.
#
#   sudo sshd -T -C user=hermes-collect | grep -iE 'forcecommand|authorizedkeysfile|permittty'
#
# Perché la credenziale che sta sulla macchina esposta non è un problema
# ---------------------------------------------------------------------
#
# Spedire invece di tirare mette una chiave privata su `hermesmcp`, che è la
# macchina che potrebbe essere compromessa. La si accetta perché TUTTO ciò
# che quella chiave permette è quello che c'è qui sotto: un `ForceCommand`
# verso un programma che appende byte a un file. Niente shell, niente
# comandi, nessuna lettura, nessun inoltro di porte, nessuna cancellazione.
#
# È una differenza di sostanza rispetto a una credenziale di scrittura su
# git, che è stata rifiutata altrove in questo progetto: chi scrive nel repo
# cambia il codice dei tool E il loro SHA dichiarato nella stessa commit.
# Qui il massimo danno è appendere righe false alla propria copia — che è
# ciò che un `hermes` compromesso può già fare sull'originale.
#
# Resta un rischio reale: riempire il disco del collector. Si confina con
# una partizione o una quota su /var/log/hermes-remoto, non con questo file.
#
# Un secondo mittente
# -------------------
#
# Si aggiunge un UTENTE e un blocco `Match` nuovi, non una chiave all'utente
# che c'è. Il nome della sorgente lo decide il `ForceCommand`, cioè root, e
# non chi si collega: due mittenti sotto lo stesso utente scriverebbero
# nella stessa copia, e nessuno dei due saprebbe più dire cosa ha spedito.

# Fuori dal `Match`, perché sshd non ammette questa direttiva dentro un
# blocco condizionale — verificato con `sshd -t`, non supposto. È già il
# default, e sta qui scritto perché su un canale che riceve prove non si
# lascia implicito che il mittente non possa portarsi dietro un ambiente.
PermitUserEnvironment no

Match User hermes-collect
    # Di root, fuori dalla home: lo stesso motivo del canale del servizio.
    #   sudo install -d -m 755 -o root -g root /etc/ssh/authorized_keys.d
    #   sudo install -m 644 -o root -g root <mittente.pub> \
    #       /etc/ssh/authorized_keys.d/hermes-collect
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/hermes-collect

    # L'argomento è il nome della SORGENTE, ed è qui che viene deciso.
    # Cambiarlo per una macchina diversa, insieme all'utente.
    ForceCommand /usr/local/sbin/hermes-log-receive hermesmcp

    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    PermitTunnel no
    PermitOpen none
    PermitListen none
