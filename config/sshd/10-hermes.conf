# hermes-core — irrigidimento di SSH (HC-04)
#
# Drop-in: si sovrappone a /etc/ssh/sshd_config senza modificarlo, quindi un
# aggiornamento della distribuzione non va riconciliato a mano e `diff`
# risponde sempre alla domanda «questa macchina è configurata come il repo?».
#
#   sudo install -m 644 -o root -g root \
#       config/sshd/10-hermes.conf /etc/ssh/sshd_config.d/10-hermes.conf
#   sudo sshd -t && sudo systemctl reload ssh
#
# Prima di installarlo, verificare che sshd legga i drop-in:
#   grep -n '^Include' /etc/ssh/sshd_config
# L'Include deve esserci E stare in cima: in sshd vince il PRIMO valore
# incontrato, quindi un Include in fondo lascerebbe vincere le direttive
# della distribuzione e questo file non avrebbe effetto. Senza Include non
# avrebbe effetto affatto — e silenziosamente.
#
# Verifica di cosa è attivo davvero (non di cosa c'è scritto qui):
#   sudo sshd -T | grep -iE 'passwordauth|permitroot|authenticationmethods'
#   sudo sshd -T -C user=hermes | grep -iE 'forcecommand|authorizedkeysfile'
#
# NESSUN indirizzo IP in questo file: è versionato, e gli indirizzi sono
# per-installazione. Il perimetro di rete lo definisce ufw, documentato in
# docs/setup-vm-hermes.md.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 20

# Due account e nessun altro: un utente di sistema che ottenesse una shell
# non entra comunque da qui. Da adattare se l'utente amministrativo ha un
# altro nome.
AllowUsers monika hermes

# --------------------------------------------------------------------------
# Account di servizio
#
# Il punto di HC-04 è tutto qui: la restrizione sul canale del servizio deve
# stare fuori dalla portata di chi la subisce. Prima viveva nella
# authorized_keys dentro la home di `hermes`, di proprietà di `hermes` — e i
# tool girano come `hermes`. Un tool compromesso poteva togliersi il comando
# forzato e aggiungere la propria chiave: il canale vincolato diventava una
# shell, e nulla nel log lo avrebbe detto.
#
# Le opzioni `command=`,`no-pty`,... restano nella authorized_keys come
# seconda rete, ma non sono più l'unica.
# --------------------------------------------------------------------------
Match User hermes
    # File di root, fuori dalla home del servizio.
    #   sudo install -d -m 755 -o root -g root /etc/ssh/authorized_keys.d
    #   sudo install -m 644 -o root -g root <chiave.pub> \
    #       /etc/ssh/authorized_keys.d/hermes
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/hermes
    # Qualunque comando chieda il client, parte solo il server MCP.
    ForceCommand /opt/hermes-core/bin/hermes-core-server
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    PermitTunnel no
    PermitOpen none
    PermitListen none
